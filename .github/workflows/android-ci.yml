name: Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译测试与打包 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 37.1 平台与构建工具
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 与核心下载资产
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs/libv2ray.aar
            app/src/main/assets/geoip.dat
            app/src/main/assets/geosite.dat
          key: ${{ runner.os }}-gradle-core-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-core-

      - name: 下载核心组件并运行单元测试
        run: ./gradlew downloadCoreAssets testDebugUnitTest --no-daemon

      - name: 执行 Lint 与编译 Debug APK
        run: ./gradlew lintDebug assembleDebug --no-daemon

      - name: 上传 Debug APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: I-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: 标签触发时编译并发布 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
