name: Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译测试与打包 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 37.1 平台与构建工具
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 与核心下载资产
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs/libv2ray.aar
            app/src/main/assets/geoip.dat
            app/src/main/assets/geosite.dat
          key: ${{ runner.os }}-gradle-core-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-core-

      - name: 校验 Release Tag 与版本号一致性
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag version: $TAG_VERSION, Gradle versionName: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app/build.gradle.kts versionName ($APP_VERSION)"
            exit 1
          fi

      - name: 配置持久化签名密钥
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            KEYSTORE_FILE="${{ runner.temp }}/iproxy-signing.p12"
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            KEY_ALIAS_TRIMMED=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
            KEYSTORE_PASS_TRIMMED=$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n')
            KEY_PASS_TRIMMED=$(printf '%s' "$KEY_PASS" | tr -d '\r\n')

            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASS_TRIMMED" -alias "$KEY_ALIAS_TRIMMED" >/dev/null
            echo "Using Secrets keystore for alias: $KEY_ALIAS_TRIMMED"

            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS_TRIMMED"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS_TRIMMED"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS_TRIMMED"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f app/signing/iproxy.p12 ]; then
            echo "::error::未找到仓库持久化签名文件 app/signing/iproxy.p12 且未配置 Secrets！"
            exit 1
          fi
          keytool -list -keystore app/signing/iproxy.p12 -storepass "iproxy2026release" -alias "iproxy" >/dev/null
          echo "Using unified repository keystore: app/signing/iproxy.p12"

      - name: 下载核心组件并运行单元测试
        run: |
          set -o pipefail
          if ! ./gradlew downloadCoreAssets testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log; then
            grep -E '^(e: |FAILURE:|\* What went wrong:|Caused by:|.*FAILED)' /tmp/gradle-test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: 执行 Lint 与编译 Debug 及 Release APK
        run: |
          set -o pipefail
          if ! ./gradlew lintDebug assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            grep -E '^(e: |FAILURE:|\* What went wrong:|Caused by:|.*FAILED)' /tmp/gradle-build.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ] && [ -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: 上传 app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传全架构 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: I-Android-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*-*.apk

      - name: 校验 Release 与 Debug 签名一致性
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          if ls app/build/outputs/apk/release/*unsigned*.apk 1>/dev/null 2>&1; then
            echo "::error::检测到未签名 Release APK，终止发布！"
            exit 1
          fi

          REL_SHA=""
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk ..."
            SHA=$("$APKSIGNER" verify --print-certs "$apk" | grep "SHA-256 digest" | head -n1)
            echo "  $SHA"
            if [ -z "$SHA" ]; then
              echo "::error::$apk 签名验证失败"
              exit 1
            fi
            if [ -z "$REL_SHA" ]; then
              REL_SHA="$SHA"
            elif [ "$REL_SHA" != "$SHA" ]; then
              echo "::error::Release APK 之间签名指纹不一致！"
              exit 1
            fi
          done

          for apk in app/build/outputs/apk/debug/*.apk; do
            DBG_SHA=$("$APKSIGNER" verify --print-certs "$apk" | grep "SHA-256 digest" | head -n1)
            if [ "$REL_SHA" != "$DBG_SHA" ]; then
              echo "::error::Debug APK 与 Release APK 签名不一致，可能导致日后无法直接覆盖更新！"
              exit 1
            fi
          done
          echo "All Release and Debug APKs verified with unified certificate: $REL_SHA"

      - name: 清理临时签名文件
        if: always()
        run: rm -f "${{ runner.temp }}/iproxy-signing.p12"

  emulator-test:
    name: 模拟器 UI 导航回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 37.1 平台与构建工具
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 与核心下载资产
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs/libv2ray.aar
            app/src/main/assets/geoip.dat
            app/src/main/assets/geosite.dat
          key: ${{ runner.os }}-gradle-core-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-core-

      - name: 预下载核心组件与构建测试 APK
        run: ./gradlew downloadCoreAssets assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: 准备模拟器测试脚本
        run: |
          cat << 'SHEOF' > /tmp/run_android_test.sh
          set +e
          echo "EMULATOR_READY $(date -u +%H:%M:%S)"
          adb logcat -c || true
          timeout 240 ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/android-test.log
          RC=${PIPESTATUS[0]}
          echo "CONNECTED_TEST_RC=$RC $(date -u +%H:%M:%S)"
          set -e
          if [ "$RC" -ne 0 ]; then
            adb logcat -d -v threadtime > /tmp/android-test-logcat.txt || true
            python3 - << 'PYEOF'
          import glob, xml.etree.ElementTree as ET
          errs = []
          for path in sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
                  for tc in root.iter("testcase"):
                      for tag in ("failure", "error"):
                          node = tc.find(tag)
                          if node is not None and node.text:
                              errs.append(f"XML {tc.attrib.get('name')}: " + "\n".join(node.text.splitlines()[:25]))
              except Exception as ex:
                  errs.append(f"XML parse error {path}: {ex}")
          try:
              with open("/tmp/android-test-logcat.txt", "r", encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()
              for i, l in enumerate(lines):
                  if "FATAL EXCEPTION" in l or "AndroidRuntime: FATAL" in l or "TestRunner: failed" in l:
                      errs.append("\n".join(lines[i:i+25]))
                      break
          except Exception:
              pass
          if not errs:
              try:
                  with open("/tmp/android-test.log", "r", encoding="utf-8", errors="replace") as f:
                      errs.append("\n".join(f.read().splitlines()[-30:]))
              except Exception:
                  pass
          msg = "\n".join(errs)[:6000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error::ANDROID_TEST_FAILED:%0A{msg}")
          PYEOF
            exit "$RC"
          fi
          SHEOF
          chmod +x /tmp/run_android_test.sh

      - name: 运行 connectedDebugAndroidTest 回归测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash /tmp/run_android_test.sh

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/androidTests/connected/debug/

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, emulator-test ]
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: I-Android-APKs
          path: release-apks

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/release/*.apk
            release-apks/debug/*.apk
          generate_release_notes: true
